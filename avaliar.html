<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8F2">
  <title>Avaliar experiência · Elarah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    /* ===========================================================
       AVALIAR — página de uma coisa só.

       Identidade do site: DM Serif Display nos títulos, DM Sans no
       texto, laranja da marca e fundo creme.

       POR QUE TUDO É PREFIXADO (#av / .av-*): o assets/app-skin.css
       ("roupa de app") está ligado no site inteiro e estiliza nomes
       genéricos — .card, .top, .body — pensando nos cards do catálogo.
       Esta página não carrega aquele CSS, e mesmo assim usa nomes
       próprios + escopo por id pra nenhum estilo global conseguir
       entrar aqui de novo.
       =========================================================== */
    :root {
      --av-orange: #F27623;
      --av-orange-light: #FF9A4D;
      --av-orange-dark: #D4600E;
      --av-star: #F5A623;
      --av-cream: #FFF8F2;
      --av-cream-dark: #FFF0E3;
      --av-ink: #241D17;
      --av-ink-soft: #6F645B;
      --av-ink-faint: #9C9188;
      --av-line: #F0E5D8;
      --av-danger: #C0392B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    #av {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--av-ink);
      /* Dois brilhos quentes atrás do cartão — profundidade sem imagem. */
      background:
        radial-gradient(60rem 30rem at 50% -10%, #FFE3C7 0%, rgba(255,227,199,0) 70%),
        radial-gradient(40rem 26rem at 90% 110%, #FFEAD6 0%, rgba(255,234,214,0) 70%),
        var(--av-cream);
    }

    #av .av-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 1px 2px rgba(36,29,23,.04), 0 18px 50px -12px rgba(36,29,23,.18);
      overflow: hidden;
      animation: av-entra .5s cubic-bezier(.2,.8,.3,1) both;
    }
    @keyframes av-entra { from { opacity: 0; transform: translateY(14px); } }

    /* ---------- topo ---------- */
    #av .av-top {
      position: relative;
      padding: 30px 26px 26px;
      text-align: center;
      color: #fff;
      border-radius: 22px 22px 0 0;
      background: linear-gradient(135deg, var(--av-orange-light) 0%, var(--av-orange) 55%, var(--av-orange-dark) 100%);
    }
    /* A "colherzinha" branca que emenda o topo laranja com o corpo. */
    #av .av-top::after {
      content: '';
      position: absolute;
      inset: auto 0 -1px 0;
      height: 26px;
      background: #fff;
      border-radius: 26px 26px 0 0;
    }
    #av .av-top__mark {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 30px;
      line-height: 1;
      letter-spacing: .01em;
    }
    #av .av-top__eyebrow {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .92;
    }

    /* ---------- corpo ---------- */
    #av .av-body { padding: 6px 26px 26px; }

    #av .av-h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 25px;
      line-height: 1.25;
      text-align: center;
      font-weight: 400;
      color: var(--av-ink);
    }
    #av .av-sub {
      margin: 9px auto 0;
      max-width: 33ch;
      text-align: center;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--av-ink-soft);
    }

    /* ---------- estrelas ---------- */
    #av .av-stars {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 22px;
    }
    #av .av-star {
      border: 0;
      background: none;
      padding: 4px;
      cursor: pointer;
      color: #E7DCCD;
      line-height: 0;
      border-radius: 10px;
      transition: transform .14s cubic-bezier(.3,1.4,.5,1), color .14s ease;
    }
    #av .av-star svg { width: 42px; height: 42px; display: block; }
    #av .av-star:hover { transform: translateY(-2px) scale(1.06); }
    #av .av-star:active { transform: scale(.94); }
    #av .av-star:focus-visible { outline: 2px solid var(--av-orange); outline-offset: 2px; }
    #av .av-star.is-on {
      color: var(--av-star);
      filter: drop-shadow(0 2px 5px rgba(242,118,35,.22));
    }
    #av .av-star.is-pop { animation: av-pop .3s cubic-bezier(.3,1.5,.5,1); }
    @keyframes av-pop { 40% { transform: scale(1.22); } }

    #av .av-stars__label {
      margin-top: 8px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--av-ink-faint);
      min-height: 20px;
      transition: color .15s ease;
    }
    #av .av-stars__label.is-on { color: var(--av-orange-dark); font-weight: 700; }

    /* ---------- comentário ---------- */
    #av .av-field { margin-top: 20px; }
    #av textarea {
      display: block;
      width: 100%;
      min-height: 104px;
      padding: 13px 15px;
      border: 1px solid var(--av-line);
      border-radius: 14px;
      background: #FFFCF9;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      color: var(--av-ink);
      resize: vertical;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    #av textarea::placeholder { color: var(--av-ink-faint); }
    #av textarea:focus {
      outline: 0;
      background: #fff;
      border-color: var(--av-orange-light);
      box-shadow: 0 0 0 3px rgba(242,118,35,.14);
    }

    /* ---------- botões ---------- */
    #av .av-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      margin-top: 14px;
      padding: 15px 20px;
      border: 0;
      border-radius: 999px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--av-orange-light), var(--av-orange));
      box-shadow: 0 6px 18px -6px rgba(242,118,35,.55);
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    #av .av-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(242,118,35,.6); }
    #av .av-btn:active { transform: translateY(0) scale(.99); }
    #av .av-btn:focus-visible { outline: 2px solid var(--av-orange-dark); outline-offset: 3px; }
    #av .av-btn[disabled] { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    #av .av-btn--ghost {
      background: #fff;
      color: var(--av-orange-dark);
      border: 1.5px solid var(--av-cream-dark);
      box-shadow: none;
    }
    #av .av-btn--ghost:hover { background: var(--av-cream); box-shadow: none; }

    #av .av-spinner {
      width: 17px; height: 17px;
      border: 2px solid rgba(255,255,255,.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: av-gira .7s linear infinite;
    }
    @keyframes av-gira { to { transform: rotate(360deg); } }

    /* ---------- mensagens ---------- */
    #av .av-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--av-ink-soft);
      min-height: 20px;
    }
    /* Sem recado, não sobra buraco no pé do cartão. */
    #av .av-msg:empty { margin-top: 0; min-height: 0; }
    #av .av-msg.is-erro { color: var(--av-danger); font-weight: 500; }

    /* ---------- obrigada ---------- */
    #av .av-done { text-align: center; }
    #av .av-done__heart {
      width: 74px; height: 74px;
      margin: 4px auto 16px;
      display: grid; place-items: center;
      font-size: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, var(--av-cream-dark), #FFE1C4);
      animation: av-bate .6s cubic-bezier(.3,1.5,.5,1) both;
    }
    @keyframes av-bate { from { transform: scale(.4); opacity: 0; } }
    #av .av-done__stars {
      margin: 12px 0 2px;
      color: var(--av-star);
      font-size: 20px;
      letter-spacing: 3px;
    }

    #av .av-hide { display: none !important; }

    @media (max-width: 380px) {
      #av .av-body { padding: 6px 20px 24px; }
      #av .av-star svg { width: 36px; height: 36px; }
      #av .av-h1 { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #av *, #av *::before, #av *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <!-- Só o app-skin.js (ponte nativa do app). O app-skin.css NÃO entra
       aqui: ele veste o catálogo e, nesta página, só desmontava o
       cartão — era ele que tirava a borda arredondada e a sombra. -->
  <script>(function(){var s=document.createElement("script");s.src="assets/app-skin.js?t="+Date.now();s.defer=true;document.head.appendChild(s);})();</script>
</head>
<body id="av">
  <main class="av-card">
    <header class="av-top">
      <div class="av-top__mark">Elarah</div>
      <div class="av-top__eyebrow" id="av-eyebrow">Sua avaliação</div>
    </header>

    <div class="av-body">
      <!-- ===== formulário ===== -->
      <div id="av-form">
        <h1 class="av-h1" id="av-titulo">Como foi sua experiência?</h1>
        <p class="av-sub" id="av-subtitulo">Sua opinião ajuda muita gente a decidir viver isso também. 🧡</p>

        <div class="av-stars" id="av-stars" role="group" aria-label="Escolha uma nota de 1 a 5 estrelas"></div>
        <p class="av-stars__label" id="av-stars-label">Toque nas estrelas pra dar sua nota</p>

        <div class="av-field">
          <label class="av-hide" for="av-comentario">Comentário</label>
          <textarea id="av-comentario" placeholder="Conta pra gente como foi! (opcional)"></textarea>
        </div>

        <button class="av-btn" id="av-enviar" type="button">Enviar avaliação</button>
        <p class="av-msg" id="av-msg" role="status" aria-live="polite"></p>
      </div>

      <!-- ===== depois de enviar ===== -->
      <div class="av-done av-hide" id="av-done">
        <div class="av-done__heart">🧡</div>
        <h1 class="av-h1" id="av-done-titulo">Obrigada pela avaliação!</h1>
        <div class="av-done__stars" id="av-done-stars"></div>
        <p class="av-sub" id="av-done-sub">Você ajudou demais a Elarah. A gente se vê na próxima experiência!</p>
        <a class="av-btn av-btn--ghost" href="https://elarah.com.br">Ver mais experiências</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var FN = 'https://nwijxjmenbfyehvscogs.supabase.co/functions/v1/reviews';
      var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53aWp4am1lbmJmeWVodnNjb2dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTA1MjQsImV4cCI6MjA5MTQyNjUyNH0.HPLrWNczhDxXH3eBLZHhsmrc3Tviah0eUuO1BsULQ-c';

      var q = new URLSearchParams(location.search);
      var bookingId = q.get('b') || '';
      // ?v= é o evento fechado (venda manual). O link do evento chega
      // pelo mesmo caminho da experiência: muda só quem assina a nota.
      var saleId = q.get('v') || '';
      var ehEvento = !!saleId && !bookingId;
      var token = q.get('t') || '';
      var nota = parseInt(q.get('nota'), 10);
      if (!(nota >= 1 && nota <= 5)) nota = 0;

      function el(id) { return document.getElementById(id); }

      // ---- textos de cada caso ----
      var COPY = ehEvento ? {
        title: 'Avaliar evento · Elarah',
        h1: 'Como foi o seu evento?',
        sub: 'Sua opinião ajuda a Elarah a deixar os próximos eventos ainda melhores. 🧡',
        placeholder: 'Conta pra gente como foi o evento! (opcional)',
        doneSub: 'Você ajudou demais a Elarah. A gente se vê no próximo evento!',
      } : {
        title: 'Avaliar experiência · Elarah',
        h1: 'Como foi sua experiência?',
        sub: 'Sua opinião ajuda muita gente a decidir viver isso também. 🧡',
        placeholder: 'Conta pra gente como foi! (opcional)',
        doneSub: 'Você ajudou demais a Elarah. A gente se vê na próxima experiência!',
      };
      document.title = COPY.title;
      el('av-titulo').textContent = COPY.h1;
      el('av-subtitulo').textContent = COPY.sub;
      el('av-comentario').placeholder = COPY.placeholder;
      el('av-done-sub').textContent = COPY.doneSub;

      var msg = el('av-msg');
      function dizer(texto, erro) {
        msg.textContent = texto || '';
        msg.classList.toggle('is-erro', !!erro);
      }

      // ---- estrelas ----
      var LEGENDAS = [
        'Toque nas estrelas pra dar sua nota',
        'Não foi bom',
        'Deu pra melhorar',
        'Foi legal',
        'Foi muito bom!',
        'Foi perfeito! 🧡',
      ];
      var SVG_ESTRELA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" ' +
        'stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
        '<path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>';

      var starsEl = el('av-stars');
      var labelEl = el('av-stars-label');
      var stars = [];
      for (var i = 1; i <= 5; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'av-star';
        b.dataset.n = String(i);
        b.setAttribute('aria-label', i + (i === 1 ? ' estrela' : ' estrelas'));
        b.innerHTML = SVG_ESTRELA;
        starsEl.appendChild(b);
        stars.push(b);
      }

      function pintar(n, previa) {
        stars.forEach(function (s) {
          var v = parseInt(s.dataset.n, 10);
          s.classList.toggle('is-on', v <= n);
          s.setAttribute('aria-pressed', String(v === nota));
        });
        labelEl.textContent = LEGENDAS[n] || LEGENDAS[0];
        labelEl.classList.toggle('is-on', !previa && n > 0);
      }

      function escolher(n) {
        nota = n;
        pintar(n);
        // Pulinho só na estrela clicada — a sensação de "registrou".
        var alvo = stars[n - 1];
        alvo.classList.remove('is-pop');
        void alvo.offsetWidth;
        alvo.classList.add('is-pop');
        if (msg.classList.contains('is-erro')) dizer('');
      }

      stars.forEach(function (s) {
        var n = parseInt(s.dataset.n, 10);
        s.addEventListener('mouseenter', function () { pintar(n, true); });
        s.addEventListener('focus', function () { pintar(n, true); });
        s.addEventListener('blur', function () { pintar(nota); });
        s.addEventListener('click', function () { escolher(n); });
      });
      starsEl.addEventListener('mouseleave', function () { pintar(nota); });
      pintar(nota);

      // ---- envio ----
      var btn = el('av-enviar');

      function carregando(ligado) {
        btn.disabled = ligado;
        btn.innerHTML = ligado ? '<span class="av-spinner"></span>Enviando…' : 'Enviar avaliação';
      }

      // Link sem id ou sem token não tem o que enviar: troca o formulário
      // por um recado em vez de deixar a pessoa tentando e falhando.
      if ((!bookingId && !saleId) || !token) {
        el('av-form').innerHTML =
          '<h1 class="av-h1">Esse link não abre</h1>' +
          '<p class="av-sub">Use o link que chegou no seu e-mail ou no WhatsApp — ' +
          'ele é único e é o que identifica a sua avaliação.</p>' +
          '<a class="av-btn av-btn--ghost" href="https://elarah.com.br">Ir para a Elarah</a>';
        return;
      }

      btn.addEventListener('click', async function () {
        if (!(nota >= 1 && nota <= 5)) {
          dizer('Escolha de 1 a 5 estrelas 🙂', true);
          return;
        }
        carregando(true);
        dizer('');
        try {
          var corpo = { mode: 'submit', token: token, nota: nota, comentario: el('av-comentario').value };
          if (ehEvento) { corpo.sale_id = saleId; } else { corpo.booking_id = bookingId; }

          var res = await fetch(FN, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + ANON },
            body: JSON.stringify(corpo),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok || !data.ok) throw new Error(data.error || ('Erro ' + res.status));

          el('av-form').classList.add('av-hide');
          el('av-done').classList.remove('av-hide');
          el('av-done-stars').textContent = '★★★★★'.slice(0, nota) + '☆☆☆☆☆'.slice(0, 5 - nota);
          if (data.already) {
            el('av-done-titulo').textContent = 'Você já tinha avaliado 🧡';
            el('av-done-sub').textContent = 'Obrigada de novo! A gente se vê na próxima.';
          }
        } catch (e) {
          carregando(false);
          dizer((e && e.message) || 'Não consegui enviar agora. Tenta de novo?', true);
        }
      });
    })();
  </script>
<script src="promo.js?v=4"></script>
</body>
</html>
