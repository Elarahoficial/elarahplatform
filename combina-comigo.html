<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual experiência tem a sua cara? · Elarah</title>
<meta name="description" content="Quatro toques e a gente descobre a experiência com a sua cara em São Paulo. Sem cadastro, sem formulário.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="canonical" href="https://elarah.com.br/combina-comigo.html">
<meta property="og:title" content="Qual experiência tem a sua cara?">
<meta property="og:description" content="Quatro toques e a gente te diz o que viver em São Paulo.">
<meta property="og:image" content="https://elarah.com.br/assets/logo.png">
<meta property="og:url" content="https://elarah.com.br/combina-comigo.html">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<!-- =====================================================================
     POR QUE ESTA PÁGINA EXISTE

     Os outros dois pontos de captura (pós-compra e avaliação) só
     alcançam quem JÁ COMPROU. Esta alcança quem ainda não comprou —
     e é justamente dessa gente que a Elarah menos sabe alguma coisa.

     A troca aqui é invertida de propósito: a pessoa recebe a
     recomendação ANTES de dar qualquer contato. Ela responde 4 chips,
     vê na hora 3 experiências escolhidas pra ela, e só DEPOIS aparece
     o "quer que eu te avise?". Quem chega até ali já viu o valor —
     por isso o WhatsApp vem de bom grado, e não arrancado.

     E como o resultado é uma frase sobre a própria pessoa
     ("você é do tipo que..."), a página é compartilhável: serve de
     link na bio e de story, virando captação e não só coleta.
     ===================================================================== -->
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#faf6f0;color:#2c211a;
       font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
  a{color:inherit;}
  .cc-wrap{max-width:560px;margin:0 auto;padding:36px 18px 60px;}
  .cc-logo{display:block;height:36px;margin:0 auto 26px;}
  .cc-hero{text-align:center;margin-bottom:26px;}
  .cc-hero h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;
              font-size:2.05rem;line-height:1.18;margin:0 0 10px;color:#1a1a1a;}
  .cc-hero p{color:#7a6c60;font-size:1rem;line-height:1.55;margin:0;}
  .cc-hero .cc-mini{font-size:.82rem;color:#a2968a;margin-top:12px;}
  .cc-res{background:#fff;border-radius:18px;padding:26px 22px;margin-top:20px;
          box-shadow:0 8px 32px rgba(0,0,0,.07);}
  .cc-res__eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
                   color:#f0a05e;font-weight:700;margin:0 0 6px;}
  .cc-res__t{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.5rem;
             line-height:1.25;margin:0 0 8px;color:#1a1a1a;}
  .cc-res__s{color:#7a6c60;font-size:.92rem;line-height:1.55;margin:0 0 20px;}
  .cc-exp{display:flex;gap:13px;align-items:center;padding:13px 0;border-top:1px solid #f2eade;
          text-decoration:none;color:inherit;}
  .cc-exp:first-of-type{border-top:none;}
  .cc-exp__img{width:62px;height:62px;flex:none;border-radius:12px;object-fit:cover;
               background:linear-gradient(135deg,#f6d5a8,#f0a05e);}
  /* As três linhas do card são <span> dentro de um <a> (âncora não
     pode conter <div>), então precisam de display:block — senão o
     nome, o bairro e o preço saem colados numa linha só. */
  .cc-exp__txt{display:block;min-width:0;}
  .cc-exp__n{display:block;font-weight:600;font-size:.97rem;line-height:1.3;margin:0 0 3px;}
  .cc-exp__m{display:block;font-size:.8rem;color:#a2968a;line-height:1.4;}
  .cc-exp__p{display:block;font-size:.86rem;color:#f0a05e;font-weight:700;margin-top:4px;}
  .cc-cta{display:block;text-align:center;margin-top:20px;background:#f0a05e;color:#fff;
          font-weight:700;font-size:1rem;padding:14px;border-radius:999px;text-decoration:none;}
  .cc-share{display:block;width:100%;margin-top:10px;background:none;border:1px solid #e6dccd;
            color:#8a7c6f;font:inherit;font-size:.88rem;padding:12px;border-radius:999px;cursor:pointer;}
  .cc-foot{text-align:center;margin-top:30px;font-size:.8rem;color:#b5a99c;line-height:1.7;}
  .hide{display:none;}
</style>
<script>(function(){var t=Date.now();var l=document.createElement("link");l.rel="stylesheet";l.href="assets/app-skin.css?t="+t;document.head.appendChild(l);var s=document.createElement("script");s.src="assets/app-skin.js?t="+t;s.defer=true;document.head.appendChild(s);})();</script>
</head>
<body>

<div class="cc-wrap">
  <a href="/"><img src="assets/logo.png" alt="Elarah" class="cc-logo"></a>

  <div class="cc-hero" id="cc-hero">
    <h1>Qual experiência tem a sua cara?</h1>
    <p>Quatro toques e a gente te diz o que viver em São Paulo.</p>
    <p class="cc-mini">Sem cadastro, sem e-mail. Leva 30 segundos.</p>
  </div>

  <div id="cc-quiz"></div>
  <div id="cc-resultado" class="hide"></div>
  <div id="cc-whats"></div>

  <p class="cc-foot">
    <a href="/">elarah.com.br</a> · experiências pra viver em São Paulo<br>
    <a href="privacidade.html">privacidade</a>
  </p>
</div>

<script src="supabase-loader.js?v=11"></script>
<script src="supabase-client.js?v=12"></script>
<script src="experiences-data.js?v=37"></script>
<script src="analytics.js?v=3"></script>
<script src="taste-capture.js?v=1"></script>
<script>
(function () {
  'use strict';

  var hero = document.getElementById('cc-hero');
  var resEl = document.getElementById('cc-resultado');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function slug(v) {
    var s = String(v == null ? '' : v);
    if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }

  // Preço em reais a partir do texto livre do catálogo ("R$ 1.380,00").
  // Mesma lógica do lado SQL: tira o ponto de milhar e corta na vírgula.
  function precoReais(txt) {
    var d = String(txt || '').replace(/\./g, '').split(',')[0].replace(/[^0-9]/g, '');
    return d ? parseInt(d, 10) : null;
  }

  var FAIXA_RANGE = {
    ate_150:  [0, 160],
    '150_250': [120, 280],
    '250_400': [220, 450],
    '400_mais': [350, 99999]
  };

  // A frase que a pessoa lê sobre si mesma. É o que faz o resultado
  // parecer um retrato e não um filtro de catálogo — e é o que ela
  // printa e manda pras amigas.
  var RETRATO = {
    namorado: 'Você é do tipo que transforma um date comum em história pra contar.',
    amigas:   'Você é do tipo que junta as amigas e inventa um programa que ninguém esquece.',
    sozinha:  'Você é do tipo que sabe que sair sozinha também é celebrar.',
    familia:  'Você é do tipo que gosta de ver a família criando junto.',
    filhos:   'Você é do tipo que prefere memória a brinquedo.',
    trabalho: 'Você é do tipo que sabe que time bom se constrói fora da sala.'
  };

  function pontua(exp, resp) {
    var cats = (window.ElarahData && window.ElarahData.categoriasOf)
      ? window.ElarahData.categoriasOf(exp).map(slug)
      : [slug(exp.categoria)];
    var score = 0;
    // A categoria marcada é o peso dominante: sem ela, a recomendação
    // não tem nada a ver com o que a pessoa acabou de dizer, e a
    // página perde a única coisa que ela promete.
    cats.forEach(function (c) { if (resp.tags.indexOf(c) >= 0) score += 50; });
    var p = precoReais(exp.preco);
    var faixa = FAIXA_RANGE[resp.faixa_preco];
    if (p && faixa) score += (p >= faixa[0] && p <= faixa[1]) ? 14 : -10;
    // Desempate estável e levemente variado, pra duas pessoas com o
    // mesmo perfil não verem exatamente a mesma lista.
    score += (String(exp.id || '').charCodeAt(0) || 0) % 5;
    return score;
  }

  async function recomendar(resp) {
    var lista = [];
    try {
      if (window.ElarahData && window.ElarahData.getVisibleExperiences) {
        lista = await window.ElarahData.getVisibleExperiences();
      }
    } catch (e) {}
    lista = (lista || []).filter(Boolean);

    var ranked = lista
      .map(function (e) { return { e: e, s: pontua(e, resp) }; })
      .filter(function (x) { return x.s > 5; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 3)
      .map(function (x) { return x.e; });

    return ranked;
  }

  function fmtPreco(exp) {
    try {
      if (window.ElarahData && window.ElarahData.formatPrecoBR) {
        return window.ElarahData.formatPrecoBR(exp.preco);
      }
    } catch (e) {}
    return exp.preco || '';
  }

  async function mostrarResultado(resp) {
    hero.classList.add('hide');
    document.getElementById('cc-quiz').innerHTML = '';
    resEl.classList.remove('hide');
    resEl.innerHTML = '<div class="cc-res"><p class="cc-res__s">Escolhendo pra você…</p></div>';

    var recs = await recomendar(resp);
    var retrato = RETRATO[(resp.companhia || [])[0]] ||
      'Você é do tipo que prefere viver a lembrar.';

    var h = '<div class="cc-res">' +
      '<p class="cc-res__eyebrow">O seu resultado</p>' +
      '<h2 class="cc-res__t">' + esc(retrato) + '</h2>';

    if (recs.length) {
      h += '<p class="cc-res__s">Separei ' + (recs.length === 1 ? 'esta' : 'estas ' + recs.length) +
        ' pra você viver:</p>';
      recs.forEach(function (e) {
        var img = e.imagem || '';
        h += '<a class="cc-exp" href="experiencia.html?id=' + encodeURIComponent(e.id) + '">' +
          (img ? '<img class="cc-exp__img" src="' + esc(img) + '" alt="" loading="lazy">'
               : '<span class="cc-exp__img"></span>') +
          '<span class="cc-exp__txt"><span class="cc-exp__n">' + esc(e.nome) + '</span>' +
          '<span class="cc-exp__m">' + esc(e.bairro || 'São Paulo') +
          (e.duracao ? ' · ' + esc(e.duracao) : '') + '</span>' +
          '<span class="cc-exp__p">' + esc(fmtPreco(e)) + '</span></span></a>';
      });
      h += '<a class="cc-cta" href="/">Ver tudo que tem aberto</a>';
    } else {
      // Sem match não se inventa recomendação ruim: assume e usa o
      // espaço pra prometer o aviso, que é exatamente o que a pessoa
      // quer nesse caso.
      h += '<p class="cc-res__s">Ainda não tenho nada aberto exatamente com essa cara — ' +
        'mas anotei o que você quer e vou atrás. Deixa seu WhatsApp aí embaixo que ' +
        'você é a primeira a saber quando abrir. 🧡</p>' +
        '<a class="cc-cta" href="/">Ver o que está aberto agora</a>';
    }

    h += '<button class="cc-share" id="cc-share">Mandar isso pra uma amiga</button>' +
      '</div>';
    resEl.innerHTML = h;

    var share = document.getElementById('cc-share');
    if (share) share.addEventListener('click', function () {
      var url = location.origin + '/combina-comigo.html';
      var txt = 'Achei isso e lembrei de você: descobre qual experiência tem a sua cara 🧡';
      if (navigator.share) {
        navigator.share({ title: 'Elarah', text: txt, url: url }).catch(function () {});
      } else {
        // Fallback de desktop: copia e confirma no próprio botão,
        // sem alert (alert em página de conversão espanta).
        try {
          navigator.clipboard.writeText(txt + ' ' + url);
          share.textContent = 'Link copiado ✓';
        } catch (e) { share.textContent = url; }
      }
      try {
        if (window.ElarahAnalytics) {
          window.ElarahAnalytics.track('cta_click',
            { category: 'taste', targetLabel: 'quiz_share' });
        }
      } catch (e) {}
    });

    // Só AGORA o pedido de contato — depois de a pessoa ter recebido
    // algo. O seed carrega tudo que ela marcou pra que esta última
    // linha no banco saia completa: gosto + telefone na mesma
    // resposta, que é o que permite identificar a pessoa.
    if (window.ElarahTaste) {
      window.ElarahTaste.mount({
        container: '#cc-whats',
        origem: 'quiz',
        force: true,
        seed: resp,
        steps: ['whatsapp'],
        metadata: { recomendadas: recs.map(function (e) { return e.nome; }) }
      });
    }
  }

  function iniciar() {
    if (!window.ElarahTaste) return;
    window.ElarahTaste.mount({
      container: '#cc-quiz',
      origem: 'quiz',
      force: true,             // a pessoa pode refazer o quiz quantas vezes quiser
      eyebrow: 'Sobre você',
      steps: ['tags', 'companhia', 'momento', 'faixa'],
      onDone: mostrarResultado
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>
</body>
</html>
