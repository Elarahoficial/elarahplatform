<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none">
  <!-- Crescent moon icon -->
  <g transform="translate(2, 2)">
    <!-- Outer arc — large C open to the right, curving from top-right down and around -->
    <path d="M40 4 C22 4, 4 18, 4 34 C4 50, 18 64, 34 66 C42 67, 48 64, 52 60"
          stroke="#F27623" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Inner swoosh — smaller crescent inside, creating the moon shape -->
    <path d="M44 18 C34 16, 20 22, 18 34 C16 46, 26 56, 38 56 C42 56, 46 54, 48 51"
          stroke="#F27623" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- "Elarah" text -->
  <text x="68" y="53" font-family="'DM Serif Display', Georgia, serif" font-size="48" font-weight="400" fill="#F27623" letter-spacing="-0.5">Elarah</text>
</svg>
