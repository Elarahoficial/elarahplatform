<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pagamento cancelado — você pode tentar novamente quando quiser.">
  <title>Pagamento cancelado — Elarah</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    .checkout-result {
      max-width: 560px;
      margin: 80px auto;
      padding: 48px 32px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
      text-align: center;
      font-family: 'DM Sans', sans-serif;
    }
    .checkout-result__icon {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: #fdf0e6;
      color: #f0a05e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .checkout-result__title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      margin: 0 0 12px;
      color: #1a1a1a;
    }
    .checkout-result__subtitle {
      color: #666;
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 420px;
    }
    .checkout-result__btn {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      background: #f0a05e;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      font-family: inherit;
    }
    .checkout-result__btn:hover { background: #e88f47; }
  </style>
</head>
<body>

  <div class="checkout-result">
    <div class="checkout-result__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="36" height="36">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1 class="checkout-result__title">Pagamento não concluído</h1>
    <p class="checkout-result__subtitle">
      Seu pagamento foi cancelado e nada foi cobrado. Quando quiser, é só voltar e
      escolher a experiência de novo — a gente te espera.
    </p>
    <a href="/" class="checkout-result__btn">Voltar para as experiências</a>
  </div><script src="supabase-loader.js?v=11"></script>
<script src="supabase-client.js?v=12"></script>
  <script src="analytics.js?v=3"></script>
  <script>
    try {
      if (window.ElarahAnalytics && ElarahAnalytics.track) {
        // Mantém o evento legado + dispara payment_failed (nome
        // canônico usado no funil do admin).
        const params = new URLSearchParams(window.location.search);
        const meta = { reason: params.get('reason') || 'user_cancel' };
        ElarahAnalytics.track('checkout_cancel_view', { category: 'checkout', metadata: meta });
        ElarahAnalytics.track('payment_failed', { category: 'checkout', metadata: meta });
      }
    } catch {}
  </script>
</body>
</html>
