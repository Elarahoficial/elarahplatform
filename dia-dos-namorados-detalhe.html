<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" id="meta-desc" content="Experiência especial Dia dos Namorados — Elarah">
  <title id="page-title">Especial Dia dos Namorados — Elarah</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="dia-dos-namorados.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    /* Estilos específicos da página de detalhe da campanha */
    .ddn-det { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
    .ddn-det__back { display:inline-flex; align-items:center; gap:6px; color:var(--ddn-wine); font-size:.85rem; text-decoration:none; margin-bottom:24px; font-weight:600; transition: color .15s; }
    .ddn-det__back:hover { color: var(--ddn-wine-dark); }
    .ddn-det__back svg { width:14px; height:14px; }

    .ddn-det__hero {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 32px;
      min-height: 360px;
      background:
        radial-gradient(ellipse 80% 80% at 50% 50%, rgba(107, 31, 46, 0.6), transparent 70%),
        linear-gradient(135deg, var(--ddn-rose-soft), var(--ddn-gold-soft));
    }
    .ddn-det__hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .ddn-det__hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(42, 20, 16, 0.85) 100%);
    }
    .ddn-det__hero-body {
      position: relative;
      padding: 220px 32px 32px;
      color: #fff;
    }
    .ddn-det__badge {
      display: inline-block;
      background: var(--ddn-gold);
      color: var(--ddn-ink);
      font-size: .68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      font-weight: 800;
    }
    .ddn-det__titulo {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.12;
      margin: 0 0 10px;
      font-weight: 400;
      max-width: 700px;
    }
    .ddn-det__subtitulo {
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      color: rgba(255,255,255,0.86);
      max-width: 640px;
      line-height: 1.5;
      margin: 0;
    }

    .ddn-det__grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
      align-items: start;
    }
    .ddn-det__content { display: flex; flex-direction: column; gap: 24px; }

    .ddn-det__section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--ddn-ink);
      margin: 0 0 12px;
      font-weight: 400;
    }
    .ddn-det__narrativa {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      border: 1px solid var(--ddn-line);
      color: var(--ddn-ink);
      font-size: 1rem;
      line-height: 1.7;
      white-space: pre-line;
    }

    .ddn-det__includes {
      background: var(--ddn-bg-warm);
      border-radius: 18px;
      padding: 22px 26px;
      border-left: 4px solid var(--ddn-gold);
    }
    .ddn-det__includes-label {
      font-size: .72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ddn-gold);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .ddn-det__includes-text { color: var(--ddn-ink); font-size: .95rem; line-height: 1.6; }

    /* Sidebar com reserva */
    .ddn-det__sidebar {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      border: 1px solid var(--ddn-line);
      box-shadow: 0 10px 30px rgba(107, 31, 46, 0.08);
      position: sticky;
      top: 24px;
    }
    .ddn-det__preco {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px;
    }
    .ddn-det__preco-label { font-size:.72rem; color:var(--ddn-ink-soft); text-transform:uppercase; letter-spacing:1px; }
    .ddn-det__preco-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--ddn-wine);
      font-weight: 400;
    }

    .ddn-det__meta-list {
      list-style: none;
      padding: 0;
      margin: 0 0 22px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .ddn-det__meta-list li {
      display: flex; align-items: center; gap: 10px;
      font-size: .9rem; color: var(--ddn-ink);
      padding: 8px 0;
      border-bottom: 1px solid var(--ddn-bg-warm);
    }
    .ddn-det__meta-list li:last-child { border-bottom: 0; }
    .ddn-det__meta-icon {
      width: 32px; height: 32px;
      background: var(--ddn-rose-soft);
      color: var(--ddn-wine);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ddn-det__meta-icon svg { width: 16px; height: 16px; }
    .ddn-det__meta-text { flex: 1; }
    .ddn-det__meta-label { font-size: .7rem; color: var(--ddn-ink-soft); text-transform: uppercase; letter-spacing: .5px; }
    .ddn-det__meta-value { font-weight: 600; font-size: .92rem; color: var(--ddn-ink); }

    /* Schedule (reusa estilo do experiencia.html mas com cor DDN) */
    .ddn-det__schedule-block { margin-bottom: 18px; }
    .ddn-det__schedule-label {
      font-size: .72rem; font-weight: 700; color: var(--ddn-wine);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px;
    }
    .ddn-det__datas, .ddn-det__horarios { display: flex; flex-wrap: wrap; gap: 8px; }
    .ddn-det__data-btn {
      padding: 10px 14px;
      font-size: .82rem; font-weight: 600;
      border: 1.5px solid var(--ddn-line);
      border-radius: 999px;
      background: #fff;
      color: var(--ddn-ink-soft);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
      text-align: center;
      min-width: 88px;
      line-height: 1.1;
    }
    .ddn-det__data-btn:hover:not(:disabled) { border-color: var(--ddn-wine); color: var(--ddn-wine); }
    .ddn-det__data-btn--active { background: var(--ddn-wine); border-color: var(--ddn-wine); color: #fff; }
    .ddn-det__data-btn small { display:block; font-size:.68rem; opacity:.75; font-weight:500; margin-top:2px; }

    .ddn-det__horario-btn {
      padding: 9px 16px;
      font-size: .85rem; font-weight: 600;
      border: 1.5px solid var(--ddn-line);
      border-radius: 10px;
      background: #fff;
      color: var(--ddn-ink-soft);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .ddn-det__horario-btn:hover { border-color: var(--ddn-wine); color: var(--ddn-wine); }
    .ddn-det__horario-btn--active { background: var(--ddn-wine); border-color: var(--ddn-wine); color: #fff; }
    .ddn-det__horario-btn--sold-out { opacity:.45; pointer-events:none; text-decoration:line-through; }

    .ddn-det__reservar {
      width: 100%;
      background: var(--ddn-wine);
      color: #fff;
      border: none;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, transform .15s;
      box-shadow: 0 12px 28px rgba(107, 31, 46, 0.28);
    }
    .ddn-det__reservar:hover { background: var(--ddn-wine-dark); transform: translateY(-2px); }

    .ddn-det__back-all {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: .82rem;
      color: var(--ddn-ink-soft);
      text-decoration: none;
    }
    .ddn-det__back-all:hover { color: var(--ddn-wine); }

    /* Mobile */
    @media (max-width: 900px) {
      .ddn-det__grid { grid-template-columns: 1fr; gap: 24px; }
      .ddn-det__sidebar { position: static; }
      .ddn-det__hero-body { padding: 160px 22px 24px; }
    }
    @media (max-width: 480px) {
      .ddn-det__hero { min-height: 280px; }
      .ddn-det__hero-body { padding: 140px 18px 20px; }
      .ddn-det__narrativa, .ddn-det__sidebar { padding: 22px 18px; }
    }
  </style>
</head>
