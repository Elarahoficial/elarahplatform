project_id = "nwijxjmenbfyehvscogs"

# Webhooks chamados por serviços externos (Stripe, Mercado Pago).
# Eles NÃO mandam JWT do Supabase — autenticam com a própria
# assinatura (stripe-signature / x-signature). Se verify_jwt ficar
# true (default), o Supabase responde 401 antes do código rodar, e
# a Stripe/MP registram falha — foi exatamente o que aconteceu.
[functions.stripe-webhook]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

# stripe-reconcile — rede de segurança que recupera reservas pagas no
# cartão que o webhook não conseguiu confirmar. Autentica por dentro
# (CRON_SECRET / service_role / admin JWT), então dispensa o JWT do
# Supabase — o cron do banco (pg_cron) chama sem token de usuário.
[functions.stripe-reconcile]
verify_jwt = false

# pagarme-webhook — notificações do Pagar.me (API V5). Não mandam JWT
# do Supabase; autenticam via Basic Auth (PAGARME_WEBHOOK_USER/PASSWORD),
# validado dentro da função. Sem verify_jwt=false o Supabase responde
# 401 antes do código rodar.
[functions.pagarme-webhook]
verify_jwt = false

# OAuth callback da Meta — chamado por redirect do navegador
# (sem header Authorization). A autenticidade é garantida pelo
# `state` aleatório criado em oauth-start (validado em uma tabela
# com TTL). Ver supabase/functions/oauth-callback/index.ts.
[functions.oauth-callback]
verify_jwt = false

# og-experience — página HTML pública lida pelo crawler do
# WhatsApp/Facebook/etc. Sem JWT por design (link compartilhável).
# Não retorna dados sensíveis: só os campos públicos da experiência.
[functions.og-experience]
verify_jwt = false

# melhor-envio-callback — OAuth callback do Melhor Envio, chamado por
# redirect do navegador (sem header Authorization). A autenticidade é
# garantida pelo `state` aleatório criado em melhor-envio-connect
# (validado na tabela melhor_envio_tokens com TTL).
[functions.melhor-envio-callback]
verify_jwt = false

# byelarah-aviso-data — aviso automático "a data saiu" pra lista de interesse
# de um evento By Elarah. Autentica por dentro (CRON_SECRET / service_role /
# JWT de admin), porque é chamada TANTO pelo pg_cron (sem token de usuário)
# QUANTO pelo painel logo depois de publicar a data.
[functions.byelarah-aviso-data]
verify_jwt = false

# admin-whatsapp-templates — diagnóstico (só leitura) dos templates aprovados
# na Meta x o que o código manda em cada fluxo. Autentica por dentro (JWT de
# admin ou CRON_SECRET/service role).
[functions.admin-whatsapp-templates]
verify_jwt = false

# whatsapp-webhook — mensagens que CHEGAM no WhatsApp oficial (Cloud API).
# A Meta não manda JWT do Supabase: autentica com X-Hub-Signature-256,
# conferida dentro da função com o META_APP_SECRET. Sem verify_jwt=false o
# Supabase responde 401 antes do código rodar, a Meta registra falha e,
# depois de muitas seguidas, DESATIVA o webhook — aí a mensagem volta a
# ser descartada.
[functions.whatsapp-webhook]
verify_jwt = false

# admin-whatsapp-inscricao — consulta/inscreve a conta do WhatsApp neste app
# (subscribed_apps). Autentica por dentro (JWT de admin, CRON_SECRET ou
# service role), igual ao admin-whatsapp-templates.
[functions.admin-whatsapp-inscricao]
verify_jwt = false

# admin-whatsapp-responder — a resposta que a Elarah escreve na tela de
# Conversas. Autentica por dentro (JWT de admin, CRON_SECRET ou service role).
[functions.admin-whatsapp-responder]
verify_jwt = false
