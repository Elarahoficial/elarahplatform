project_id = "nwijxjmenbfyehvscogs"

# Webhooks chamados por serviços externos (Stripe, Mercado Pago).
# Eles NÃO mandam JWT do Supabase — autenticam com a própria
# assinatura (stripe-signature / x-signature). Se verify_jwt ficar
# true (default), o Supabase responde 401 antes do código rodar, e
# a Stripe/MP registram falha — foi exatamente o que aconteceu.
[functions.stripe-webhook]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

# OAuth callback da Meta — chamado por redirect do navegador
# (sem header Authorization). A autenticidade é garantida pelo
# `state` aleatório criado em oauth-start (validado em uma tabela
# com TTL). Ver supabase/functions/oauth-callback/index.ts.
[functions.oauth-callback]
verify_jwt = false

# og-experience — página HTML pública lida pelo crawler do
# WhatsApp/Facebook/etc. Sem JWT por design (link compartilhável).
# Não retorna dados sensíveis: só os campos públicos da experiência.
[functions.og-experience]
verify_jwt = false

# melhor-envio-callback — OAuth callback do Melhor Envio, chamado por
# redirect do navegador (sem header Authorization). A autenticidade é
# garantida pelo `state` aleatório criado em melhor-envio-connect
# (validado na tabela melhor_envio_tokens com TTL).
[functions.melhor-envio-callback]
verify_jwt = false

# whatsapp-welcome — chamado por um TRIGGER do banco (public.profiles
# insert) via pg_net, sem JWT de usuário. Autentica com o segredo
# compartilhado ELARAH_WEBHOOK_SECRET (header Authorization: Bearer).
[functions.whatsapp-welcome]
verify_jwt = false

# whatsapp-group-blast — convida a base já cadastrada pro grupo.
# Disparável por SQL/pg_net (segredo) ou admin; autentica por dentro.
[functions.whatsapp-group-blast]
verify_jwt = false

# whatsapp-confirmacao — chamado por um TRIGGER do banco (public.bookings
# quando o status vira 'pago') via pg_net, sem JWT de usuário. Autentica
# com o segredo compartilhado ELARAH_WEBHOOK_SECRET (Authorization: Bearer).
[functions.whatsapp-confirmacao]
verify_jwt = false

# whatsapp-pendente — cron de recuperação de venda (reservas pendentes).
# Disparável por SQL/pg_net (segredo) ou admin; autentica por dentro.
[functions.whatsapp-pendente]
verify_jwt = false

# whatsapp-lembrete — cron diário (lembrete 2 dias antes da experiência).
# Disparável por SQL/pg_net (segredo) ou admin; autentica por dentro.
[functions.whatsapp-lembrete]
verify_jwt = false

# whatsapp-feedback — cron diário (pedido de avaliação D+1, complementa
# o e-mail). Disparável por SQL/pg_net (segredo) ou admin; autentica dentro.
[functions.whatsapp-feedback]
verify_jwt = false
