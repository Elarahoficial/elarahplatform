project_id = "nwijxjmenbfyehvscogs"

# Webhooks chamados por serviços externos (Stripe, Mercado Pago).
# Eles NÃO mandam JWT do Supabase — autenticam com a própria
# assinatura (stripe-signature / x-signature). Se verify_jwt ficar
# true (default), o Supabase responde 401 antes do código rodar, e
# a Stripe/MP registram falha — foi exatamente o que aconteceu.
[functions.stripe-webhook]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

# OAuth callback da Meta — chamado por redirect do navegador
# (sem header Authorization). A autenticidade é garantida pelo
# `state` aleatório criado em oauth-start (validado em uma tabela
# com TTL). Ver supabase/functions/oauth-callback/index.ts.
[functions.oauth-callback]
verify_jwt = false

# og-experience — página HTML pública lida pelo crawler do
# WhatsApp/Facebook/etc. Sem JWT por design (link compartilhável).
# Não retorna dados sensíveis: só os campos públicos da experiência.
[functions.og-experience]
verify_jwt = false

# melhor-envio-callback — OAuth callback do Melhor Envio, chamado por
# redirect do navegador (sem header Authorization). A autenticidade é
# garantida pelo `state` aleatório criado em melhor-envio-connect
# (validado na tabela melhor_envio_tokens com TTL).
[functions.melhor-envio-callback]
verify_jwt = false

# giftcard-followup — dispara e-mail de follow-up de gift cards
# pendentes. Dois chamadores: (1) o admin pelo navegador, com JWT —
# validado em código via is_admin(); (2) um agendamento (cron), SEM
# JWT, autenticado pelo header X-Cron-Secret (== CRON_SECRET). Como o
# cron não manda JWT do Supabase, o gateway não pode exigir verify_jwt
# — a autorização é 100% no código (admin OU segredo). Ver o header de
# supabase/functions/giftcard-followup/index.ts.
[functions.giftcard-followup]
verify_jwt = false
