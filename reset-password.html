<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Redefina sua senha de acesso à Elarah.">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha — Elarah</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
</head>
<body style="background:#faf7f2;">

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="background:#fff;border-radius:20px;padding:36px 32px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.08);">
      <div style="text-align:center;margin-bottom:20px;">
        <img src="assets/logo.png" alt="Elarah" style="max-width:120px;height:auto;">
      </div>

      <h1 style="font-family:'DM Serif Display',serif;font-size:1.6rem;text-align:center;margin:0 0 8px;color:#1a1a1a;">Redefinir senha</h1>

      <!-- Loading state -->
      <div id="reset-loading" style="text-align:center;color:#666;font-size:0.9rem;padding:20px 0;">
        <p>Validando link de recuperação...</p>
      </div>

      <!-- Error state -->
      <div id="reset-invalid" style="display:none;text-align:center;padding:16px 0;">
        <p id="reset-invalid-msg" style="color:#c0392b;font-size:0.9rem;margin:0 0 16px;">
          Link de recuperação inválido ou expirado.
        </p>
        <p style="color:#666;font-size:0.85rem;margin:0 0 16px;">
          Solicite um novo link na página inicial clicando em <strong>Esqueci minha senha</strong>.
        </p>
        <a href="/" style="display:inline-block;padding:12px 20px;background:#ff6a00;color:#fff;border-radius:10px;text-decoration:none;font-size:0.9rem;font-weight:600;">
          Voltar para a página inicial
        </a>
      </div>

      <!-- Form state -->
      <div id="reset-ready" style="display:none;">
        <p style="text-align:center;color:#666;font-size:0.9rem;margin:0 0 24px;">Escolha sua nova senha abaixo.</p>

        <form id="reset-form">
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:0.85rem;color:#333;margin-bottom:6px;">Nova senha</label>
            <input id="reset-senha" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required
                   style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:0.95rem;box-sizing:border-box;">
          </div>
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:0.85rem;color:#333;margin-bottom:6px;">Confirmar nova senha</label>
            <input id="reset-senha2" type="password" minlength="6" placeholder="Repita a senha" required
                   style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:0.95rem;box-sizing:border-box;">
          </div>

          <p id="reset-error" style="color:#c0392b;font-size:0.85rem;margin:6px 0 0;min-height:1.2em;"></p>
          <p id="reset-success" style="color:#2e7d32;font-size:0.85rem;margin:6px 0 0;display:none;"></p>

          <button type="submit" id="reset-submit"
                  style="width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;background:#ff6a00;color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;">
            Salvar nova senha
          </button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:0.85rem;">
          <a href="/" style="color:#ff6a00;text-decoration:none;">Voltar para a página inicial</a>
        </p>
      </div>
    </div>
  </div><!-- Loader multi-CDN: tenta unpkg, jsdelivr em sequência. -->
<script>
(function () {
  var CDNS = [
    'https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js'
  ];
  function tryLoad(i) {
    if (i >= CDNS.length) {
      console.error('[Elarah] Todos os CDNs do Supabase falharam.');
      return;
    }
    var s = document.createElement('script');
    s.src = CDNS[i];
    s.onerror = function () {
      console.warn('[Elarah] CDN falhou: ' + CDNS[i] + ' — tentando próximo');
      tryLoad(i + 1);
    };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
<script src="supabase-client.js?v=9"></script>
  <script>
    (function () {
      'use strict';

      const loadingEl  = document.getElementById('reset-loading');
      const invalidEl  = document.getElementById('reset-invalid');
      const invalidMsg = document.getElementById('reset-invalid-msg');
      const readyEl    = document.getElementById('reset-ready');
      const form       = document.getElementById('reset-form');
      const senhaEl    = document.getElementById('reset-senha');
      const senha2El   = document.getElementById('reset-senha2');
      const errorEl    = document.getElementById('reset-error');
      const successEl  = document.getElementById('reset-success');
      const submitBtn  = document.getElementById('reset-submit');

      let recoveryReady = false;
      let decided = false;

      function showInvalid(msg) {
        if (decided) return;
        decided = true;
        loadingEl.style.display = 'none';
        readyEl.style.display = 'none';
        invalidEl.style.display = 'block';
        if (msg) invalidMsg.textContent = msg;
      }
      function showForm() {
        if (decided) return;
        decided = true;
        recoveryReady = true;
        loadingEl.style.display = 'none';
        invalidEl.style.display = 'none';
        readyEl.style.display = 'block';
      }

      const client = window.supabaseClient;
      if (!client) {
        showInvalid('Não foi possível carregar o Supabase. Recarregue a página.');
        return;
      }

      // 1) Listen for PASSWORD_RECOVERY event (this is what Supabase
      //    emits after processing the ?code=... from the recovery link).
      const sub = client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          showForm();
        }
      });

      // 2) Fallback: after a short delay, try to exchange the URL code
      //    manually, in case detectSessionInUrl already fired before we
      //    registered, or the event shape differs.
      (async () => {
        // small delay so detectSessionInUrl has a chance to process
        await new Promise(r => setTimeout(r, 500));
        if (decided) return;

        try {
          // Try explicit code exchange if URL has ?code=...
          const url = new URL(window.location.href);
          const code = url.searchParams.get('code');
          if (code && typeof client.auth.exchangeCodeForSession === 'function') {
            const { data, error } = await client.auth.exchangeCodeForSession(code);
            if (!error && data && data.session) {
              showForm();
              return;
            }
          }

          // Hash-token flow (implicit recovery link)
          if (window.location.hash && window.location.hash.indexOf('type=recovery') !== -1) {
            // detectSessionInUrl should have handled this; check session
            const { data: { session } } = await client.auth.getSession();
            if (session) {
              showForm();
              return;
            }
          }

          // Final fallback: already-authenticated session (e.g. user came
          // directly while logged in) — still allow password change.
          const { data: { session } } = await client.auth.getSession();
          if (session) {
            showForm();
            return;
          }

          showInvalid('Link de recuperação inválido ou expirado. Solicite um novo link na página inicial.');
        } catch (e) {
          console.warn('[Reset] code exchange failed', e);
          showInvalid('Não foi possível validar o link de recuperação. Solicite um novo.');
        }
      })();

      // 3) Hard timeout: if nothing decided in 6s, show invalid.
      setTimeout(() => {
        if (!decided) {
          showInvalid('Tempo esgotado ao validar o link. Solicite um novo link de recuperação.');
        }
      }, 6000);

      // ---- Form submit ----
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        successEl.style.display = 'none';

        if (!recoveryReady) {
          errorEl.textContent = 'O link ainda não foi validado. Aguarde ou solicite um novo.';
          return;
        }

        const senha = (senhaEl.value || '').trim();
        const senha2 = (senha2El.value || '').trim();

        if (senha.length < 6) {
          errorEl.textContent = 'A senha deve ter pelo menos 6 caracteres.';
          return;
        }
        if (senha !== senha2) {
          errorEl.textContent = 'As senhas não coincidem.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Salvando...';

        try {
          const { error } = await client.auth.updateUser({ password: senha });
          if (error) {
            errorEl.textContent = error.message || 'Não foi possível atualizar a senha.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Salvar nova senha';
            return;
          }
          successEl.textContent = 'Senha atualizada com sucesso! Redirecionando...';
          successEl.style.display = 'block';
          // Force a fresh login with the new password.
          try { await client.auth.signOut(); } catch {}
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } catch (err) {
          errorEl.textContent = 'Erro ao atualizar senha.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Salvar nova senha';
        }
      });
    })();
  </script>
</body>
</html>
