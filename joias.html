<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =====================================================
       PÁGINA DE LANDING — Workshop de Joalheria (Ouro)
       -----------------------------------------------------
       Existe SOMENTE para servir o preview correto no WhatsApp/
       Facebook/iMessage quando o link é compartilhado em campanha.
       Crawler lê og:* daqui (HTML estático) e gera preview com
       imagem + título + descrição. Visitante humano é redirecionado
       imediatamente pra experiencia.html?id=<UUID> via JS.

       ⚠️ ANTES DE PUBLICAR EM CAMPANHA, AJUSTE 2 PLACEHOLDERS:
         1. EXPERIENCE_ID (linha do <meta refresh> e do <script>)
            → UUID real da experiência no Supabase.
         2. og:image / <img src> / twitter:image
            → caminho do arquivo (ex: assets/joias.jpg).
       Sem isso, o link cai pra home como fallback e a imagem
       fica com o logo Elarah em vez da capa da experiência.
       ===================================================== -->

  <!-- ===== Open Graph (WhatsApp / Facebook / iMessage) =====
       Texto pensado pra apelar emocionalmente. Algumas histórias
       merecem mais que palavras — merecem ouro. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Elarah">
  <meta property="og:title" content="Crie a joia que vai marcar o seu amor — em ouro 🤍">
  <meta property="og:description" content="Algumas histórias merecem mais que palavras. Workshop exclusivo de joalheria: do zero, você desenha e forja uma aliança ou anel em ouro que se torna o símbolo do que você ama. Vagas limitadíssimas.">
  <meta property="og:image" content="https://elarah.com.br/assets/joias.jpg">
  <meta property="og:image:secure_url" content="https://elarah.com.br/assets/joias.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Workshop de Joalheria em Ouro — Elarah">
  <meta property="og:url" content="https://elarah.com.br/joias.html">

  <!-- ===== Twitter Card ===== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Crie a joia que vai marcar o seu amor — em ouro 🤍">
  <meta name="twitter:description" content="Algumas histórias merecem mais que palavras. Workshop exclusivo de joalheria. Vagas limitadíssimas.">
  <meta name="twitter:image" content="https://elarah.com.br/assets/joias.jpg">

  <meta name="description" content="Workshop exclusivo de joalheria em ouro. Crie sua aliança ou anel — símbolo do amor que merece ser eternizado.">

  <title>Crie a joia que vai marcar o seu amor — em ouro · Elarah</title>
  <link rel="icon" href="assets/logo.png" type="image/png">

  <!-- Fallback meta refresh (caso JS falhe). Sem o redirect, o
       crawler do WhatsApp não segue (não roda JS), só humano.
       ⚠️ TODO: troque ID_DA_EXPERIENCIA pelo UUID real. -->
  <meta http-equiv="refresh" content="2;url=experiencia.html?id=ID_DA_EXPERIENCIA">

  <style>
    body {
      margin: 0;
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #faf6f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .wrap {
      max-width: 520px;
      text-align: center;
    }
    .wrap img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,.12);
      margin-bottom: 24px;
    }
    .wrap h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.6rem;
      margin: 0 0 12px;
      color: #1a1a1a;
      line-height: 1.25;
    }
    .wrap p {
      color: #555;
      font-size: .96rem;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3px solid #f0a05e;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 24px;
      background: #f0a05e;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: .92rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/joias.jpg" alt="Workshop de Joalheria em Ouro">
    <h1>Crie a joia que vai marcar o seu amor 🤍</h1>
    <p>Algumas histórias merecem mais que palavras — merecem ouro.<br>
       Te levando pra página da experiência…</p>
    <a href="experiencia.html?id=ID_DA_EXPERIENCIA" class="fallback-btn" id="fallback-btn">Ver experiência</a>
  </div>

  <!-- ============================================================
       REDIRECT IMEDIATO (humano apenas — crawler não executa JS)
       ⚠️ TODO: troque ID_DA_EXPERIENCIA pelo UUID real.
       ============================================================ -->
  <script>
  (function () {
    'use strict';
    var EXPERIENCE_ID = 'ID_DA_EXPERIENCIA';
    try {
      window.location.replace('experiencia.html?id=' + encodeURIComponent(EXPERIENCE_ID));
    } catch (e) {
      window.location.href = 'experiencia.html?id=' + encodeURIComponent(EXPERIENCE_ID);
    }
  })();
  </script>
</body>
</html>
