name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - claude/create-elarah-homepage-VsE5i
      - claude/fix-purchase-errors-2GrQL
      - claude/peaceful-wright-oh8k98
      - claude/mercado-pago-audit-update-n4r6l8
      - claude/account-access-password-recovery-k1o8t4
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Aceita os dois nomes de secret (SUPABASE_PROJECT_REF ou
      # SUPABASE_PROJECT_ID) — usa o que estiver configurado.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sanity check: aborta cedo com mensagem clara se algum secret
      # estiver faltando, em vez de cair num "supabase: command failed"
      # opaco depois.
      - name: Validar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado nos Secrets do repositório"
            exit 1
          fi
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Configure o secret SUPABASE_PROJECT_REF (ou SUPABASE_PROJECT_ID) nos Secrets do repositório"
            exit 1
          fi
          echo "✓ Secrets presentes (project_ref=${PROJECT_REF:0:6}...)"

      # Deploy direto, sem `supabase link` — passar --project-ref em
      # cada deploy é o jeito recomendado pela Supabase pra CI/CD,
      # porque `link` exige SUPABASE_DB_PASSWORD que não é necessário
      # pra deploy de Edge Function.
      #
      # `set -e` garante que qualquer função que falhe aborta o job —
      # sem isso o workflow ficaria "verde" mesmo com função quebrada.
      - name: Deploy das Edge Functions
        run: |
          set -e
          # Retry automático: o bundling baixa dependências do esm.sh, que
          # às vezes responde 522 (timeout transitório do Cloudflare) e
          # derrubava o deploy inteiro. Aqui cada função tenta até 5x com
          # espera crescente antes de falhar de verdade.
          deploy() {
            local name="$1"; shift
            local attempt=1
            until [ "$attempt" -gt 5 ]; do
              echo "→ $name (tentativa $attempt)"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" "$@"; then
                return 0
              fi
              echo "::warning::deploy de $name falhou (tentativa $attempt/5) — nova tentativa em $((attempt*15))s"
              sleep "$((attempt*15))"
              attempt=$((attempt+1))
            done
            echo "::error::deploy de $name falhou após 5 tentativas"
            return 1
          }

          in_list() { case " $2 " in *" $1 "*) return 0;; *) return 1;; esac; }

          # =========================================================
          # DESCOBERTA DINÂMICA: deploya TODA função em supabase/functions/
          # (não há mais allowlist manual — função nova é publicada sozinha).
          # =========================================================
          #
          # SKIP: funções deployadas por OUTRO processo/manual (social/OAuth/OG
          # e o _shared, que não é função). Mantê-las fora preserva o
          # comportamento atual e evita exigir secrets que este job não tem.
          SKIP="_shared oauth-callback oauth-start og-experience refresh-tokens sync-instagram"
          #
          # JWT_REQUIRED: mantêm verify_jwt (só admin autenticada dispara —
          # validam profiles.role='admin' por dentro). TODO o resto é chamado
          # pelo front (anon key) ou por webhook/cron que autentica por dentro,
          # então recebe --no-verify-jwt. (Política idêntica à anterior.)
          JWT_REQUIRED="admin-account-access admin-set-aguardando-experiencia notify-manual-sale resend-booking-confirmation send-supplier-customer-message send-manual-sale-confirmation melhor-envio-connect"

          echo "== Descobrindo funções em supabase/functions/ =="
          DEPLOYED=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if in_list "$name" "$SKIP"; then
              echo "↷ pulando: $name (fora deste workflow)"
              continue
            fi
            if in_list "$name" "$JWT_REQUIRED"; then
              echo "🔒 $name (com verify_jwt)"
              deploy "$name"
            else
              echo "🌐 $name (--no-verify-jwt)"
              deploy "$name" --no-verify-jwt
            fi
            DEPLOYED="$DEPLOYED $name"
          done

          echo ""
          echo "== Funções publicadas com sucesso =="
          for n in $DEPLOYED; do echo "  ✓ $n"; done
          echo "Total publicado: $(echo $DEPLOYED | wc -w)"

          # Verificação dura (item 7): as funções do Pagar.me transparente
          # PRECISAM ter sido publicadas. Se qualquer uma faltar (pasta no
          # SKIP por engano, ou não commitada), o job FALHA — não fica verde.
          MUST_HAVE="create-pagarme-card-payment create-pagarme-pix-payment get-pagarme-public-key create-pagarme-checkout pagarme-webhook"
          for req in $MUST_HAVE; do
            if ! in_list "$req" "$DEPLOYED"; then
              echo "::error::Função obrigatória NÃO publicada: $req — verifique se a pasta existe em supabase/functions/ e não está no SKIP."
              exit 1
            fi
          done
          echo "✓ Deploy completo — todas as funções previstas publicadas."
