name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - claude/create-elarah-homepage-VsE5i
      - claude/fix-purchase-errors-2GrQL
      - claude/peaceful-wright-oh8k98
      - claude/mercado-pago-audit-update-n4r6l8
      - claude/account-access-password-recovery-k1o8t4
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Aceita os dois nomes de secret (SUPABASE_PROJECT_REF ou
      # SUPABASE_PROJECT_ID) — usa o que estiver configurado.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sanity check: aborta cedo com mensagem clara se algum secret
      # estiver faltando, em vez de cair num "supabase: command failed"
      # opaco depois.
      - name: Validar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado nos Secrets do repositório"
            exit 1
          fi
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Configure o secret SUPABASE_PROJECT_REF (ou SUPABASE_PROJECT_ID) nos Secrets do repositório"
            exit 1
          fi
          echo "✓ Secrets presentes (project_ref=${PROJECT_REF:0:6}...)"

      # Deploy direto, sem `supabase link` — passar --project-ref em
      # cada deploy é o jeito recomendado pela Supabase pra CI/CD,
      # porque `link` exige SUPABASE_DB_PASSWORD que não é necessário
      # pra deploy de Edge Function.
      #
      # `set -e` garante que qualquer função que falhe aborta o job —
      # sem isso o workflow ficaria "verde" mesmo com função quebrada.
      - name: Deploy das Edge Functions
        run: |
          set -e
          # Retry automático: o bundling baixa dependências do esm.sh, que
          # às vezes responde 522 (timeout transitório do Cloudflare) e
          # derrubava o deploy inteiro. Aqui cada função tenta até 3x com
          # espera crescente antes de falhar de verdade.
          deploy() {
            local name="$1"; shift
            local attempt=1
            until [ "$attempt" -gt 5 ]; do
              echo "→ $name (tentativa $attempt)"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" "$@"; then
                return 0
              fi
              echo "::warning::deploy de $name falhou (tentativa $attempt/5) — nova tentativa em $((attempt*15))s"
              sleep "$((attempt*15))"
              attempt=$((attempt+1))
            done
            echo "::error::deploy de $name falhou após 5 tentativas"
            return 1
          }

          deploy create-checkout-session --no-verify-jwt
          deploy create-mp-pix-payment --no-verify-jwt
          deploy create-mp-card-payment --no-verify-jwt
          # get-mp-public-key: só devolve a public key publicável da MP
          # pro front. Sem JWT (o front chama com a anon key como apikey).
          deploy get-mp-public-key --no-verify-jwt
          deploy stripe-webhook --no-verify-jwt
          # stripe-reconcile: rede de segurança que recupera reservas
          # pagas no cartão que o webhook não confirmou. Autentica por
          # dentro (CRON_SECRET/service_role/admin), então --no-verify-jwt.
          deploy stripe-reconcile --no-verify-jwt
          deploy mp-webhook --no-verify-jwt
          # Pagar.me (Stone) — checkout hospedado via Payment Links V5.
          # create-pagarme-checkout: chamada pelo front com a anon key,
          # então --no-verify-jwt (mesmo padrão do create-mp-pix-payment).
          # pagarme-webhook: notificação do Pagar.me (sem JWT do Supabase),
          # autentica por Basic Auth por dentro — --no-verify-jwt.
          deploy create-pagarme-checkout --no-verify-jwt
          deploy pagarme-webhook --no-verify-jwt
          deploy check-mp-payment-status --no-verify-jwt
          deploy redeem-gift-card --no-verify-jwt
          # delete-account: --no-verify-jwt porque valida o token do
          # usuário por dentro (auth.getUser) e só apaga a conta DELE.
          deploy delete-account --no-verify-jwt
          # send-password-recovery: endpoint público ("esqueci minha
          # senha"). Gera o link server-side (service role) e manda
          # pelo Resend — não depende do e-mail nativo do Supabase, que
          # tinha rate limit e não entregava pra clientes reais.
          deploy send-password-recovery --no-verify-jwt
          # As funções abaixo mantêm verify_jwt (default): só admin
          # autenticada dispara. NÃO usar --no-verify-jwt nelas.
          # admin-account-access: destrava o acesso de um cliente
          # (senha temporária + confirma e-mail + link). Valida por
          # dentro que o caller é admin (profiles.role='admin').
          deploy admin-account-access
          deploy notify-manual-sale
          deploy resend-booking-confirmation
          deploy send-supplier-customer-message
          deploy send-manual-sale-confirmation
          # analytics-insights faz a própria autorização por dentro
          # (CRON_SECRET/service_role/admin), então precisa de --no-verify-jwt.
          deploy analytics-insights --no-verify-jwt
          deploy calculate-shipping --no-verify-jwt
          deploy melhor-envio-callback --no-verify-jwt
          deploy melhor-envio-connect
          echo "✓ Deploy completo"
