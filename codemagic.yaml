# Configuração do Codemagic para gerar o app iOS da Elarah na nuvem
# (sem precisar de Mac — o Codemagic usa Macs deles).
#
# Pré-requisitos (feitos uma vez, pelo navegador do Dell):
#   1. Conta Apple Developer (US$ 99/ano).
#   2. No App Store Connect, criar o app com o Bundle ID: com.elarah.app
#   3. No Codemagic, criar a integração "App Store Connect API key" com o
#      nome EXATO: ElarahASC (em Settings -> Integrations -> Developer Portal)
#
# Depois é só apertar "Start new build" no workflow "Elarah iOS".

workflows:
  ios-elarah:
    name: Elarah iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ElarahASC
    environment:
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.elarah.app"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias do app
        script: |
          cd app
          npm install
      - name: Gerar conteudo web e sincronizar iOS
        script: |
          cd app
          npm run build
          npx cap sync ios
      - name: Gerar icones e splash da Elarah
        script: |
          cd app
          npx @capacitor/assets generate --ios || true
      - name: Preparar keychain
        script: keychain initialize
      - name: Montar e exportar o app (Xcode gerencia a assinatura)
        script: |
          set -e
          # grava a chave da App Store Connect em arquivo para o xcodebuild usar
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8
          ARCH="$CM_BUILD_DIR/build/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"
          # arquiva deixando o Xcode criar/baixar certificado e perfil automaticamente
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/asc_key.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=GSJ74NLDRH \
            archive
          # exporta o .ipa pronto para a App Store
          xcodebuild -exportArchive \
            -archivePath "$ARCH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist app/ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/asc_key.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Envia automaticamente para o TestFlight (teste). Depois, quando quiser,
        # dá pra promover para a App Store pública pelo App Store Connect.
        submit_to_testflight: true
