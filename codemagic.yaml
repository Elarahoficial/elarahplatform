# Configuração do Codemagic para gerar o app iOS da Elarah na nuvem
# (sem precisar de Mac — o Codemagic usa Macs deles).
#
# Pré-requisitos (feitos uma vez, pelo navegador do Dell):
#   1. Conta Apple Developer (US$ 99/ano).
#   2. No App Store Connect, criar o app com o Bundle ID: com.elarah.app
#   3. No Codemagic, criar a integração "App Store Connect API key" com o
#      nome EXATO: ElarahASC (em Settings -> Integrations -> Developer Portal)
#
# Depois é só apertar "Start new build" no workflow "Elarah iOS".

workflows:
  ios-elarah:
    name: Elarah iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ElarahASC
    environment:
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.elarah.app"
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependencias do app
        script: |
          cd app
          npm install
      - name: Gerar conteudo web e sincronizar iOS
        script: |
          cd app
          npm run build
          npx cap sync ios
      - name: Gerar icones e splash da Elarah
        script: |
          cd app
          npx @capacitor/assets generate --ios || true
      - name: Configurar assinatura (certificado + perfil)
        script: |
          set -e
          keychain initialize
          # gera a chave privada (PKCS#8) usada para criar o certificado de distribuicao
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/cert_key.pem
          # cria o certificado de distribuicao (usando a chave) e o perfil de provisionamento
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          # adiciona o certificado ao keychain e aplica o perfil no projeto
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Montar o app (IPA)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Envia automaticamente para o TestFlight (teste). Depois, quando quiser,
        # dá pra promover para a App Store pública pelo App Store Connect.
        submit_to_testflight: true
