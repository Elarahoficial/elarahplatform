# Configuração do Codemagic para gerar o app iOS da Elarah na nuvem.
#
# O projeto nativo (App.xcodeproj, Podfile, Info.plist, AppDelegate) NÃO é
# versionado no git — ele é REGENERADO a cada build a partir da fonte Capacitor
# (app/package.json + app/capacitor.config.json + app/www). Assim o build é
# determinístico e não depende de nenhum cache do Codemagic.
#
# Pré-requisitos (feitos uma vez, pelo navegador):
#   1. Conta Apple Developer.
#   2. App no App Store Connect com o Bundle ID: com.elarah.app
#   3. Integração "App Store Connect API key" no Codemagic com o nome: ElarahASC
#
# Depois é só apertar "Start new build" no workflow "Elarah iOS".

workflows:
  ios-elarah:
    name: Elarah iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ElarahASC
    environment:
      groups:
        # Grupo de variaveis criado no Codemagic. Deve conter CERT_KEY (chave
        # privada de assinatura, marcada como "Secure"). Sem isso o build cai
        # no modo antigo (gera chave nova e acumula certificados).
        - elarah_signing
      vars:
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_WORKSPACE: "app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.elarah.app"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias do app
        script: |
          cd app
          npm install
      - name: Gerar conteudo web (copy-web)
        script: |
          cd app
          npm run build
      - name: Regenerar projeto iOS nativo
        script: |
          set -e
          cd app
          # o projeto nativo nao e versionado: regeneramos do zero
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Aplicar ajustes nativos (privacidade + permissoes)
        script: |
          cd app
          PLIST="ios/App/App/Info.plist"
          # Privacy manifest da Elarah (sobre o gerado pelo Capacitor)
          cp -f native-overrides/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy || true
          # Descricoes de uso (evita crash em <input type=file> nas telas de admin)
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription A Elarah usa suas fotos apenas quando voce escolhe uma imagem para enviar. Nada e acessado sem sua acao." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string A Elarah usa suas fotos apenas quando voce escolhe uma imagem para enviar. Nada e acessado sem sua acao." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription A camera e usada apenas se voce optar por tirar uma foto para enviar dentro do app. Nada e capturado sem sua acao." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string A camera e usada apenas se voce optar por tirar uma foto para enviar dentro do app. Nada e capturado sem sua acao." "$PLIST" || true
          # Numero de build UNICO e sempre crescente (timestamp). O App Store
          # Connect recusa build number repetido; regenerar o projeto zerava p/ 1.
          BUILD_NO=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NO" "$PLIST" || true
          # tambem no projeto (caso o Info.plist use \$(CURRENT_PROJECT_VERSION))
          ( cd ios/App && agvtool new-version -all "$BUILD_NO" ) 2>/dev/null || true
          echo "--- Info.plist (chaves de uso + build) ---"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || true
      - name: Gerar icones e splash da Elarah
        script: |
          cd app
          mkdir -p assets
          cp -f www/assets/pwa/icon-512.png assets/icon.png || true
          npx @capacitor/assets generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' || true
      - name: Configurar assinatura (certificado + perfil)
        script: |
          set -e
          keychain initialize
          # Chave PRIVADA PERSISTENTE (variavel segura CERT_KEY no Codemagic).
          # Assim o certificado de distribuicao e criado UMA vez e reutilizado
          # em todos os builds — sem acumular certificados (evita o erro 409
          # "You already have a current Distribution certificate").
          # Se a variavel nao existir, cai no modo antigo (gera uma nova chave).
          if [ -n "$CERT_KEY" ]; then
            printf '%s\n' "$CERT_KEY" > /tmp/cert_key.pem
            echo "Usando chave de assinatura persistente (CERT_KEY)."
          else
            echo "CERT_KEY nao definida — gerando chave nova (pode acumular certificados)."
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/cert_key.pem
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Montar o app (IPA)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Envia automaticamente para o TestFlight. Depois, quando quiser, da pra
        # promover para a App Store publica pelo App Store Connect.
        submit_to_testflight: true
