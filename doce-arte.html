  <!-- =====================================================
       PÁGINA DE LINKS DO PARCEIRO — "link na bio"
       -----------------------------------------------------
       Página co-branded (parceiro + Elarah) com TODOS os links
       das experiências do parceiro que estão públicas no site.

       A lista NÃO é escrita à mão: ela é montada em tempo de
       carregamento a partir da mesma fonte que o site usa
       (ElarahData.getVisibleExperiences), então:
         - experiência oculta no admin (is_active=false) não aparece
         - experiência vencida / dentro do cutoff não aparece
         - experiência nova do parceiro aparece sozinha
       Ou seja: não precisa mexer nesta página quando o catálogo
       do parceiro muda.

       Pra criar a página de OUTRO parceiro: copie este arquivo e
       troque só o bloco PARCEIRO lá embaixo.
       ===================================================== -->

  <link rel="stylesheet" href="parceiro-links.css?v=1">
  <style>
    /* Doce Arte — laranja e vinho, na linha da Elarah (a pedido),
       não o bege do logo: o selo bege dela pousa sobre o creme da
       Elarah e o contraste fica com o vinho nos títulos e o laranja
       nos realces. Só as cores — a estrutura vem de parceiro-links.css. */
    :root {
      --afa-wine:   #7B2B2B;
      --afa-wine-d: #5E1F1F;
      --afa-rose:   #F27623;
      --afa-blush:  #FDE8D6;
      --afa-sage:   #7B2B2B;
      --afa-sand:   #F7C9A0;
      --afa-cream:  #FFF8F2;
      --afa-ink:    #2B1F1B;
      --afa-muted:  #7A6A62;
      --afa-line:   #F2E2D4;
      --afa-logo-bg: radial-gradient(circle at 50% 45%, #FFFCF8 0%, var(--afa-blush) 70%, #F6D9BE 100%);
      --afa-logo-shadow: 0 8px 26px rgba(123,43,43,.16);
    }
  </style>
</head>
<body>
  <div class="afa-bg" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <main class="afa">
    <header class="afa__head">
      <div class="afa__logo" id="afa-logo">
        <span class="afa__logo-fallback" id="afa-logo-fallback">Doce<br>Arte</span>

      <a class="afa__badge" href="index.html" id="afa-badge">
        Reserve pela <img src="assets/logo.png" alt="Elarah">
      </a>
    </header>

    <h2 class="afa__section-title">Experiências com vaga aberta</h2>

    <div class="afa__list" id="afa-list" aria-live="polite" aria-busy="true">
      <div class="afa-skel"></div>
      <div class="afa-skel"></div>
      <div class="afa-skel"></div>
    </div>

    <p class="afa__msg" id="afa-empty" hidden></p>

    <a class="afa__all" href="index.html">Ver todas as experiências da Elarah →</a>

       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.2-5.2A8.5 8.5 0 1 1 21 11.5z"></path>

      Fale com a Elarah · <strong>(11)&nbsp;91445-5930</strong>

      Reservas, pagamento e confirmação pela <a href="index.html">Elarah</a>.<br>

<script src="promo.js?v=5"></script>
  <script src="supabase-loader.js?v=11"></script>
  <script src="supabase-client.js?v=12"></script>
  <script src="experiences-data.js?v=42"></script>
  <script src="analytics.js?v=4"></script>
  <script src="parceiro-links.js?v=2"></script>
  <script>
    // Config deste parceiro. Pra outro parceiro: copie o HTML e mude
    // só este bloco (e os textos do cabeçalho acima).
    ElarahParceiroLinks.init({
      nome: 'Doce Arte',
      // Nome do fornecedor exatamente como está no cadastro da
      // experiência. A comparação ignora acento, maiúscula e espaço
      // sobrando, mas exige o nome INTEIRO — assim um parceiro futuro
      // de nome parecido não cai nesta página.
      //
      // No admin as experiências dela estão em "Giuliana Gini" (nome
      // da parceira), enquanto a página se apresenta como Doce Arte
      // (marca). "Doce Arte" fica na lista porque é a própria marca
      // dela: se algum cadastro futuro usar a marca em vez do nome,
      // entra do mesmo jeito.
      match: ['Giuliana Gini', 'Doce Arte'],
      // Escape hatch: IDs de experiências que devem entrar mesmo se o
      // campo "Fornecedor" estiver vazio/diferente no admin.
      idsExtra: [],
      // Caminhos onde o logo pode estar. A página testa na ordem e usa
      // o primeiro que existir. O arquivo commitado já vem recortado no
      // selo redondo e com o branco de fora em transparência.
      logo: [
        'assets/parceiros/doce-arte.png',
        'assets/parceiros/doce-arte.jpg',
        'assets/parceiros/giuliana.png',
        'assets/doce-arte.png',
        'assets/doce-arte.jpg',
        'assets/docearte.png',
        'assets/docearte.jpg'
      ],
      // FALTA CONFIRMAR: assim que vierem, descomentar e preencher.
      // Sem eles a página simplesmente não mostra os chips de contato.
      // instagram: 'docearte',
      // whatsapp: '5511999999999',
      // whatsappLabel: '(11) 99999-9999',
      utm: 'doce-arte'
    });
  </script>
